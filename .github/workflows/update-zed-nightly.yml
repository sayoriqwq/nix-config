name: 更新 Zed Nightly

on:
  schedule:
    - cron: "20 21 * * *"
  workflow_dispatch:

concurrency:
  group: update-zed-nightly
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: 检出 main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: 安装 Nix 并限定 Zed Cachix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
        with:
          extra_nix_config: |
            accept-flake-config = false
            extra-substituters = https://zed.cachix.org
            extra-trusted-public-keys = zed.cachix.org-1:/pHQ6dpMsAZk2DiP4WCL0p9YDNKWj2Q5FL20bNmw1cU=

      - name: 检查是否已有更新 PR
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count="$(gh pr list --head automation/zed-nightly --state open --json number --jq length)"
          if [[ "$count" != "0" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "已有 Zed Nightly 更新 PR，本次不叠加新的锁文件变更。"
          fi

      - name: 更新 Zed 锁定版本
        id: update
        if: steps.existing.outputs.skip != 'true'
        run: |
          nix flake update zed

          mapfile -t changed < <(git diff --name-only)
          if [[ "${#changed[@]}" == "0" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${#changed[@]}" != "1" || "${changed[0]}" != "flake.lock" ]]; then
            printf '更新 Zed 时出现超出 flake.lock 的文件变化：\n%s\n' "${changed[@]}" >&2
            exit 1
          fi

          {
            echo "changed=true"
            echo "revision=$(nix flake metadata --json . | jq -r '.locks.nodes.zed.locked.rev')"
            echo "version=$(nix eval --raw .#packages.x86_64-linux.zed-nightly.version)"
          } >> "$GITHUB_OUTPUT"

      - name: 验证 Nightly 更新
        if: steps.update.outputs.changed == 'true'
        run: |
          nix fmt -- --check .
          nix flake check
          nix build .#zed-nightly --no-link --print-out-paths

      - name: 创建更新提交
        if: steps.update.outputs.changed == 'true'
        env:
          ZED_REVISION: ${{ steps.update.outputs.revision }}
          ZED_VERSION: ${{ steps.update.outputs.version }}
        run: |
          git switch -c automation/zed-nightly
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "chore: update Zed Nightly to ${ZED_VERSION} (${ZED_REVISION:0:7})"
          git push origin automation/zed-nightly

      - name: 创建 Draft PR
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ZED_REVISION: ${{ steps.update.outputs.revision }}
          ZED_VERSION: ${{ steps.update.outputs.version }}
        run: |
          gh pr create \
            --draft \
            --base main \
            --head automation/zed-nightly \
            --title "[Zed Nightly] 更新到 ${ZED_VERSION}" \
            --body "## 自动更新摘要

          - Zed revision：\`${ZED_REVISION}\`
          - Zed version：\`${ZED_VERSION}\`
          - 仅更新 Zed input 所需的 \`flake.lock\` 节点
          - Linux Nightly package、formatter 与 Flake check 已通过

          这是 Draft PR。它不会自动批准、合并或激活任何真实机器。macOS system build 与真实应用验收仍由维护者关卡控制。"
